# Live database checks for repos with Supabase (dwd-kb CONVENTIONS.md section 13).
#
# Fails if the live project and the migration files disagree, or if the security
# advisor shows a warning. Other repos call it from their own ci.yml:
#   jobs:
#     db-live:
#       if: github.event_name != 'push' && github.actor != 'dependabot[bot]'
#       uses: deepwater-digital/.github/.github/workflows/db-live.yml@<full commit SHA>
#       secrets:
#         CHECKS_DB_URL: ${{ secrets.CHECKS_DB_URL }}
#
# CHECKS_DB_URL logs in as a role that can read the schema and the migration
# history, and no table holding data. It must use the session pooler, since
# GitHub's runners have no IPv6. No access token is needed: linking a project
# would need one that can read the project's API keys.
#
# The caller's package.json pins the Supabase CLI. This repo is public, so the
# secret comes from the caller.
name: db-live

on:
  workflow_call:
    inputs:
      schemas:
        description: Comma separated schemas to compare. Supabase's own schemas stay out, since it changes them itself.
        type: string
        default: public
      checkout-ref:
        description: Compare against these files instead of the base branch. Only for proving the checks catch drift.
        type: string
        default: ""
    secrets:
      CHECKS_DB_URL:
        required: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # An explicit shell turns on pipefail, so a crashed command fails the step.
    defaults:
      run:
        shell: bash
    steps:
      # A PR's new migration is not applied until it merges, so a PR compares
      # the live project with the base branch's files, not its own. This also
      # means a PR's own code never runs in a job that holds secrets.
      - name: Check out the migrations the live project should match
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      # Secrets are set only on the steps after this one, so install scripts
      # never see them.
      - name: Install the pinned Supabase CLI
        run: npm ci

      # The CLI's JSON output is parsed strictly, so output it cannot read fails
      # the check instead of passing it.
      - name: Migration history matches the files
        env:
          CHECKS_DB_URL: ${{ secrets.CHECKS_DB_URL }}
        run: |
          npx supabase migration list --db-url "$CHECKS_DB_URL" --output-format json --agent no > history.json
          jq -c '.migrations[]' history.json
          unmatched=$(jq -e '[.migrations[] | select(.local == "" or .remote == "")] | length' history.json)
          if [ "$unmatched" != "0" ]; then
            echo "Migration history does not match the files: $unmatched row(s) differ."
            exit 1
          fi

      - name: No drift between the live schema and the files
        env:
          SCHEMAS: ${{ inputs.schemas }}
          CHECKS_DB_URL: ${{ secrets.CHECKS_DB_URL }}
        run: |
          npx supabase db diff --db-url "$CHECKS_DB_URL" --schema "$SCHEMAS" --output-format json --agent no > drift.json
          drift=$(jq -er '.diff | strings' drift.json)
          if [ -n "$drift" ]; then
            echo "The live schema has drifted from the migration files:"
            echo "$drift"
            exit 1
          fi

      - name: Security advisor shows no warnings
        env:
          CHECKS_DB_URL: ${{ secrets.CHECKS_DB_URL }}
        run: npx supabase db advisors --db-url "$CHECKS_DB_URL" --type security --fail-on warn --agent no
